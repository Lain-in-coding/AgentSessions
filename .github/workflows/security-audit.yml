name: security-audit

"on":
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  dependency-audit:
    name: Cargo dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install pinned audit tools
        run: |
          cargo install --locked --version 0.20.2 cargo-deny
          cargo install --locked --version 0.22.2 cargo-audit

      - name: Verify committed lockfile
        run: cargo metadata --locked --no-deps --format-version 1 > /dev/null

      - name: Check dependency policy
        run: cargo deny check

      - name: Check RustSec advisories
        run: cargo audit --file Cargo.lock
