[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["spikes", "Github_src"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT OR Apache-2.0"
rust-version = "1.90"

[workspace.dependencies]
blake3 = "1.5"
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
