[package]
name = "agentsessions-adapters-sqlite"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
agentsessions-domain = { path = "../agentsessions-domain" }
agentsessions-ports = { path = "../agentsessions-ports" }
rusqlite = { version = "0.40", features = ["bundled"] }
serde_json.workspace = true
blake3.workspace = true
# 与 spikes/data-root-locking 同一原语：OS 独占文件锁作 writer lease 权威。
fs4 = { version = "0.13", features = ["sync"] }

[dev-dependencies]
tempfile = "3"
