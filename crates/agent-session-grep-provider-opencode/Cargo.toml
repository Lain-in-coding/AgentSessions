[package]
name = "agent-session-grep-provider-opencode"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
agent-session-grep-domain = { path = "../agent-session-grep-domain" }
agent-session-grep-ports = { path = "../agent-session-grep-ports" }
serde = { workspace = true }
serde_json = { workspace = true }
rusqlite = { version = "0.40", default-features = false, features = ["bundled"] }

[dev-dependencies]
# Golden test parses emitted timestamps with the production search-filter
# parser. The application crate depends on no provider crate, so no cycle.
agent-session-grep-application = { path = "../agent-session-grep-application" }
agent-session-grep-testkit = { path = "../agent-session-grep-testkit" }
blake3 = { workspace = true }
