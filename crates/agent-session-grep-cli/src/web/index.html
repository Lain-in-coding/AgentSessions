<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>agent-session-grep</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #1a1a2e; color: #e0e0e0; }
.container { max-width: 1200px; margin: 0 auto; padding: 20px; }
header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-bottom: 10px; border-bottom: 1px solid #333; }
header h1 { font-size: 1.4rem; color: #64ffda; }
.status { font-size: 0.85rem; color: #888; }
.search-bar { display: flex; gap: 10px; margin-bottom: 20px; }
.search-bar input { flex: 1; padding: 10px 14px; background: #16213e; border: 1px solid #333; border-radius: 6px; color: #e0e0e0; font-size: 0.95rem; }
.search-bar input:focus { outline: none; border-color: #64ffda; }
.search-bar button { padding: 10px 20px; background: #0f3460; border: none; border-radius: 6px; color: #64ffda; cursor: pointer; font-size: 0.95rem; }
.search-bar button:hover { background: #1a4a7a; }
.filters { display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; }
.filters select, .filters input { padding: 6px 10px; background: #16213e; border: 1px solid #333; border-radius: 4px; color: #e0e0e0; font-size: 0.85rem; }
.results { display: flex; flex-direction: column; gap: 10px; }
.hit { background: #16213e; border: 1px solid #2a2a4a; border-radius: 8px; padding: 14px; cursor: pointer; transition: border-color 0.2s; }
.hit:hover { border-color: #64ffda; }
.hit-header { display: flex; justify-content: space-between; margin-bottom: 8px; }
.hit-id { font-family: monospace; font-size: 0.8rem; color: #888; }
.hit-score { font-size: 0.8rem; color: #64ffda; font-weight: bold; }
.hit-text { font-size: 0.9rem; line-height: 1.5; color: #ccc; }
.hit-session { font-size: 0.8rem; color: #aaa; margin-top: 6px; }
.hit-why { font-size: 0.75rem; color: #6a9; margin-top: 4px; }
.empty { text-align: center; padding: 40px; color: #666; }
.context-panel { position: fixed; top: 0; right: -600px; width: 580px; height: 100vh; background: #16213e; border-left: 1px solid #333; transition: right 0.3s; overflow-y: auto; padding: 20px; }
.context-panel.open { right: 0; }
.context-panel h2 { font-size: 1.1rem; color: #64ffda; margin-bottom: 15px; }
.context-panel .msg { margin-bottom: 12px; padding: 10px; background: #0f3460; border-radius: 6px; }
.context-panel .msg-role { font-size: 0.75rem; color: #888; text-transform: uppercase; }
.context-panel .msg-text { font-size: 0.9rem; margin-top: 4px; color: #ddd; }
.close-btn { position: absolute; top: 15px; right: 15px; background: none; border: none; color: #888; font-size: 1.5rem; cursor: pointer; }
.retrieval-mode { font-size: 0.75rem; color: #6a9; }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>agent-session-grep</h1>
    <div class="status" id="status">Connecting…</div>
  </header>
  <div class="search-bar">
    <input type="text" id="query" placeholder="Search session history…" onkeypress="if(event.key==='Enter')doSearch()">
    <button onclick="doSearch()">Search</button>
  </div>
  <div class="filters">
    <select id="provider"><option value="">All Providers</option></select>
    <select id="mode">
      <option value="lexical">Lexical</option>
      <option value="semantic">Semantic</option>
      <option value="hybrid">Hybrid</option>
    </select>
    <input type="number" id="limit" value="20" min="1" max="100" style="width:80px">
  </div>
  <div class="retrieval-mode" id="retrievalMode"></div>
  <div class="results" id="results"><div class="empty">Type a query and press Search</div></div>
</div>
<div class="context-panel" id="contextPanel">
  <button class="close-btn" onclick="closeContext()">×</button>
  <h2 id="contextTitle">Session Context</h2>
  <div id="contextMessages"></div>
</div>
<script>
const token = new URLSearchParams(location.search).get('token') || '';
const headers = {'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json'};

async function api(path, opts) {
  const resp = await fetch(path, {...opts, headers});
  if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
  return resp.json();
}

async function init() {
  try {
    const health = await api('/health');
    document.getElementById('status').textContent = '● Connected (generation ' + (health.generation || '?') + ')';
    loadProviders();
  } catch(e) {
    document.getElementById('status').textContent = '● Disconnected: ' + e.message;
  }
}

async function loadProviders() {
  try {
    const data = await api('/api/status');
    const sel = document.getElementById('provider');
    (data.providers || []).forEach(p => {
      const opt = document.createElement('option');
      opt.value = p.id; opt.textContent = p.id + ' (' + p.found + ')';
      sel.appendChild(opt);
    });
  } catch(e) { /* providers optional */ }
}

async function doSearch() {
  const q = document.getElementById('query').value.trim();
  if (!q) return;
  const mode = document.getElementById('mode').value;
  const limit = document.getElementById('limit').value;
  document.getElementById('results').innerHTML = '<div class="empty">Searching…</div>';
  try {
    const params = new URLSearchParams({q, mode, limit});
    const data = await api('/api/search?' + params);
    document.getElementById('retrievalMode').textContent = 'retrieval_mode: ' + (data.retrieval_mode || 'lexical');
    renderHits(data.hits || []);
  } catch(e) {
    document.getElementById('results').innerHTML = '<div class="empty">Error: ' + e.message + '</div>';
  }
}

function renderHits(hits) {
  const el = document.getElementById('results');
  if (!hits.length) { el.innerHTML = '<div class="empty">No hits</div>'; return; }
  el.innerHTML = hits.map((h, i) => `
    <div class="hit" onclick="loadContext('${h.session_id || h.id}')">
      <div class="hit-header">
        <span class="hit-id">${h.id}</span>
        <span class="hit-score">${h.score.toFixed(2)}</span>
      </div>
      <div class="hit-text">${escapeHtml(h.text || h.snippet || '')}</div>
      ${h.session_id ? `<div class="hit-session">session: ${h.session_id}</div>` : ''}
      ${h.why_matched && h.why_matched.length ? `<div class="hit-why">why: ${h.why_matched.join(', ')}</div>` : ''}
    </div>
  `).join('');
}

async function loadContext(sessionId) {
  if (!sessionId) return;
  document.getElementById('contextPanel').classList.add('open');
  document.getElementById('contextTitle').textContent = 'Session: ' + sessionId;
  document.getElementById('contextMessages').innerHTML = '<div class="empty">Loading…</div>';
  try {
    const data = await api('/api/context?session=' + sessionId);
    const msgs = data.messages || [];
    document.getElementById('contextMessages').innerHTML = msgs.map(m => `
      <div class="msg">
        <div class="msg-role">${escapeHtml(m.role || '?')}</div>
        <div class="msg-text">${escapeHtml(m.text || '')}</div>
      </div>
    `).join('') || '<div class="empty">No messages</div>';
  } catch(e) {
    document.getElementById('contextMessages').innerHTML = '<div class="empty">Error: ' + e.message + '</div>';
  }
}

function closeContext() {
  document.getElementById('contextPanel').classList.remove('open');
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

init();
</script>
</body>
</html>
