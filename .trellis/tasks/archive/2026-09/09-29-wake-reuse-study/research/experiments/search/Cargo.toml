[package]
name = "wake-reuse-search"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
publish = false
license = "MIT OR Apache-2.0"

[workspace]
resolver = "3"

[features]
default = []
cache = ["rusqlite/cache"]

[dependencies]
agent-session-grep-application = { path = "../../../../../../crates/agent-session-grep-application", default-features = false }
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "=0.10.9"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "unwind"
strip = "debuginfo"
